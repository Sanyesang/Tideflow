<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101a1d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="潮序" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>潮序 Tideflow · 手机工作台</title>
  <link rel="icon" href="/assets/tideflow-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/mobile.css" />
  <script type="module" src="/mobile.js"></script>
</head>
<body>
  <div class="phone-app">
    <header class="app-header">
      <a class="brand" href="#home" aria-label="潮序首页"><img src="/assets/tideflow-mark.svg" alt="" /><span>潮序<small>TIDEFLOW</small></span></a>
      <div class="header-actions"><span class="pill">邀请内测</span><button class="icon-button" data-info="notice" aria-label="官方公告">◌</button></div>
    </header>
    <main id="screen" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="手机主导航">
      <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v11h-6v-7H9v7H3Z"/></svg><span>首页</span></button>
      <button data-tab="strategies"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>策略</span></button>
      <button data-tab="activity"><svg viewBox="0 0 24 24"><path d="M4 21V11h4v10m4 0V3h4v18m4 0V7h3v14M2 21h21"/></svg><span>运行</span></button>
      <button data-tab="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-3a8 8 0 0 1 16 0v3Z"/></svg><span>账户</span></button>
    </nav>
  </div>
  <dialog id="detail-dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" class="icon-button" aria-label="关闭">×</button></div><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
